[package]
name = "mwi-combat-engine"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM port of the MWI combat simulator engine (slice-by-slice parity with the JS engine)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip：serde_json 默认的浮点解析不是正确舍入的（实测 "0.18359999999999999"
# 会解析成差 1 ULP 的另一侧），而逐位 parity 要求 JSON 里的十进制浮点必须与 JS 解析
# 结果完全一致。开启该特性后使用正确舍入的解析器。
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
wasm-bindgen-test = "0.2"

[profile.release]
opt-level = 3
lto = true

# wasm-opt (binaryen) 从 GitHub Release 下载在国内网络下极慢/易挂起（实测 3 次构建全部卡死）。
# 切片 1-4 不依赖其体积/性能收益；切片 5+ 做性能对照前再启用（可通过镜像或 PATH 安装 binaryen）。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
